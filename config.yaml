language: zh-CN
auto_freeze: true
freeze_checks:
  human_beats_baseline_on_every_metric: true
  human_T3_cer_max: 0.05        # 已校准（2026-11-24）：保持 0.05 不放宽；实测真人 CER 开发组 0.046、终审组 0.046
generation:
  k_hypotheses: 6
  min_targeting_worst_diagnostic: 3
  min_exploratory: 1
  population_size: 8
  listening_every: 5
  stall_generations: 6
optimizer:
  method: cma-es
  evals_per_variant: 150
  dev_subset_sentences: 30
eval_quota_per_experiment: 2
param_cap: 3000
gates:                           # 阶段 0.3 已校准（2026-11-24），此后不再修改。规则见 reports/calibration.md
  M1_formant_rel_error_max: 0.099
  M2_syllable_acc_min: 0.93
  M2_tone_acc_min: 0.918
  M3_dev_cer_max: 0.093
escalate:
  single_gen_main_metric_jump: 0.15
  prediction_miss_factor: 5
budget:
  max_generations: 200
  max_wall_hours: 48             # 人填写（2026-11-24）
  max_parallel_workers: 6
  max_spend: null                # 人确认：暂不设上限（2026-11-24）
